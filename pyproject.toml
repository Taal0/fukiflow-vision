[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fukiflow-vision"
version = "0.7.0"
description = "FukiFlow vision pipeline (detect, clean, typeset, compose)"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["vision*"]
# Note: the FastAPI `app/` package is NOT installed — run via
# `uvicorn app.main:app` from this repo so it does not shadow fukiflow-app.
